<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="hitbox">
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .hit { animation: blink 1.4s steps(2, end) infinite }
      .fire { animation: drift 1.4s ease-in-out infinite }
      @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
      @keyframes drift { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(-10px) } }
    }
  </style>
  <rect width="640" height="480" fill="#0C0C0F"/>
  <g shape-rendering="crispEdges">
  <!-- ground -->
  <rect x="40" y="320" width="560" height="10" fill="#2E3441"/>
  <rect x="80" y="330" width="40" height="10" fill="#1E222B"/>
  <rect x="300" y="330" width="60" height="10" fill="#1E222B"/>
  <rect x="480" y="330" width="30" height="10" fill="#1E222B"/>
  <!-- hurtbox around the slime -->
  <rect x="190" y="190" width="140" height="110" fill="#34C7E0" opacity=".14"/>
<rect x="180" y="180" width="160" height="10" fill="#34C7E0"/>
<rect x="180" y="300" width="160" height="10" fill="#34C7E0"/>
<rect x="180" y="180" width="10" height="130" fill="#34C7E0"/>
<rect x="330" y="180" width="10" height="130" fill="#34C7E0"/>
  <rect x="180" y="180" width="20" height="20" fill="#9BE7F5"/>
  <rect x="320" y="180" width="20" height="20" fill="#9BE7F5"/>
  <rect x="180" y="290" width="20" height="20" fill="#9BE7F5"/>
  <rect x="320" y="290" width="20" height="20" fill="#9BE7F5"/>
  <!-- slime -->
  <rect x="240" y="200" width="40" height="10" fill="#7BD88F"/>
<rect x="220" y="210" width="20" height="10" fill="#B9F0C3"/>
<rect x="240" y="210" width="60" height="10" fill="#7BD88F"/>
<rect x="210" y="220" width="10" height="10" fill="#B9F0C3"/>
<rect x="220" y="220" width="90" height="10" fill="#7BD88F"/>
<rect x="200" y="230" width="120" height="10" fill="#7BD88F"/>
<rect x="200" y="240" width="30" height="10" fill="#7BD88F"/>
<rect x="230" y="240" width="20" height="10" fill="#F4F7F5"/>
<rect x="250" y="240" width="30" height="10" fill="#7BD88F"/>
<rect x="280" y="240" width="20" height="10" fill="#F4F7F5"/>
<rect x="300" y="240" width="20" height="10" fill="#7BD88F"/>
<rect x="200" y="250" width="30" height="10" fill="#7BD88F"/>
<rect x="230" y="250" width="10" height="10" fill="#F4F7F5"/>
<rect x="240" y="250" width="10" height="10" fill="#0C0C0F"/>
<rect x="250" y="250" width="30" height="10" fill="#7BD88F"/>
<rect x="280" y="250" width="10" height="10" fill="#F4F7F5"/>
<rect x="290" y="250" width="10" height="10" fill="#0C0C0F"/>
<rect x="300" y="250" width="20" height="10" fill="#7BD88F"/>
<rect x="200" y="260" width="120" height="10" fill="#7BD88F"/>
<rect x="210" y="270" width="100" height="10" fill="#4FA85F"/>
<rect x="220" y="280" width="80" height="10" fill="#4FA85F"/>
  <!-- fireball with its hitbox -->
  <g class="fire">
  <rect x="440" y="220" width="50" height="50" fill="#FF5C5C" opacity=".16"/>
<rect x="430" y="210" width="70" height="10" fill="#FF5C5C"/>
<rect x="430" y="270" width="70" height="10" fill="#FF5C5C"/>
<rect x="430" y="210" width="10" height="70" fill="#FF5C5C"/>
<rect x="490" y="210" width="10" height="70" fill="#FF5C5C"/>
  <rect x="460" y="220" width="10" height="10" fill="#F28C38"/>
<rect x="450" y="230" width="10" height="10" fill="#F28C38"/>
<rect x="460" y="230" width="10" height="10" fill="#F7D774"/>
<rect x="470" y="230" width="10" height="10" fill="#F28C38"/>
<rect x="440" y="240" width="10" height="10" fill="#F28C38"/>
<rect x="450" y="240" width="30" height="10" fill="#F7D774"/>
<rect x="480" y="240" width="10" height="10" fill="#F28C38"/>
<rect x="450" y="250" width="10" height="10" fill="#F28C38"/>
<rect x="460" y="250" width="10" height="10" fill="#F7D774"/>
<rect x="470" y="250" width="10" height="10" fill="#F28C38"/>
<rect x="460" y="260" width="10" height="10" fill="#F28C38"/>
  <rect x="500" y="240" width="20" height="10" fill="#B8602A"/>
  <rect x="520" y="240" width="10" height="10" fill="#6E3A1C"/>
  </g>
  </g>
</svg>
